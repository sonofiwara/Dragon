name: Compiler l'APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer les dépendances
        run: npm ci

      - name: Copier l'app web dans le projet Android
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk detecteur-orbes.apk

      - name: APK en pièce jointe du build
        uses: actions/upload-artifact@v4
        with:
          name: detecteur-orbes-apk
          path: detecteur-orbes.apk

      - name: Publier l'APK dans la release « latest »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest detecteur-orbes.apk \
            --title "Détecteur d'Orbes — dernière version" \
            --notes "APK compilé automatiquement depuis le commit ${GITHUB_SHA::7}."
